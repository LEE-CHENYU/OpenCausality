- id: imported_inflation_instrument_to_cpi_tradable
  from: imported_inflation_instrument
  to: cpi_tradable
  edge_type: causal
  notes: 'Critic-added: Imported inflation instrument (interaction of exchange rate
    change and import share) captures exchange rate passthrough to tradable goods
    prices. Higher imported inflation raises tradable CPI through direct cost-push
    channel.'
  identification_strategy:
    type: SHIFT_SHARE_IV
    argument: The imported inflation instrument interacts exogenous exchange rate
      variation (shift component from global oil prices) with pre-period regional
      import intensity (share component). This Bartik-style construction isolates
      the cost-push channel of imported inflation to tradable CPI.
    key_assumption: Pre-period import shares are uncorrelated with time-varying local
      demand shocks that independently affect tradable CPI.
  unit_specification:
    treatment_unit: pct
    outcome_unit: pct
  acceptance_criteria:
    plausibility:
      expected_sign: positive
  timing:
    lag: 1
    lag_unit: month
  forbidden_controls:
  - cpi_headline
  - kzt_usd
- id: brent_oil_to_kzt_usd
  from: brent_oil
  to: kzt_usd
  edge_type: causal
  notes: 'Critic-added: Oil export revenues drive Kazakhstan''s current account and
    capital flows. Higher oil prices increase USD inflows, appreciating KZT (reducing
    kzt_usd). This is the primary channel of external shocks to the domestic economy.'
  identification_strategy:
    type: EXTERNAL_INSTRUMENT
    argument: Brent oil price is determined in global commodity markets and exogenous
      to Kazakhstan as a small price-taking economy. Oil revenue (~60% of exports)
      drives the current account surplus and NBK foreign exchange interventions, mechanically
      affecting KZT/USD.
    key_assumption: Kazakhstan is a price-taker in global oil markets; Brent price
      is not affected by Kazakhstan-specific shocks.
  unit_specification:
    treatment_unit: log
    outcome_unit: log
  acceptance_criteria:
    plausibility:
      expected_sign: negative
  timing:
    lag: 1
    lag_unit: month
  forbidden_controls:
  - kzt_usd
- id: nbk_base_rate_to_deposit_cost_kspi
  from: nbk_base_rate
  to: deposit_cost_kspi
  edge_type: causal
  notes: 'Critic-added: The NBK base rate sets the floor for interbank rates and directly
    influences deposit pricing by commercial banks. Higher base rates increase deposit
    costs as banks compete for funding.'
  identification_strategy:
    type: EXTERNAL_INSTRUMENT
    argument: The NBK base rate is a monetary policy instrument set by the central
      bank based on inflation targeting. It is exogenous to individual bank balance
      sheet conditions. The pass-through to deposit costs operates through the interbank
      market and competitive deposit pricing.
    key_assumption: The NBK sets the base rate based on aggregate inflation and output
      gap, not in response to Kaspi-specific deposit market conditions.
  unit_specification:
    treatment_unit: pp
    outcome_unit: pct
  acceptance_criteria:
    plausibility:
      expected_sign: positive
  timing:
    lag: 1
    lag_unit: quarter
  forbidden_controls:
  - vix_shock
- id: cor_kspi_to_rwa_kspi
  from: cor_kspi
  to: rwa_kspi
  edge_type: causal
  notes: 'Critic-added: Higher cost of risk reflects credit quality deterioration;
    non-performing loans receive higher risk weights under Basel regulatory framework,
    mechanically increasing risk-weighted assets.'
  identification_strategy:
    type: panel_regression
    argument: Cost of risk (provisions-to-assets ratio) maps to risk-weighted assets
      through Basel regulatory risk-weight schedules. Bank-level panel with time fixed
      effects absorbs macro shocks; cross-sectional variation in portfolio composition
      provides identification.
    key_assumption: Basel risk-weight rules provide a stable mapping from provision
      rates to risk weights; no omitted bank-specific shocks simultaneously drive
      both provisioning policy and asset composition.
  unit_specification:
    treatment_unit: pct
    outcome_unit: log
  acceptance_criteria:
    plausibility:
      expected_sign: positive
  timing:
    lag: 1
    lag_unit: quarter
  forbidden_controls:
  - total_capital_kspi
  - k2_ratio_kspi
- id: real_expenditure_to_rwa_kspi
  from: real_expenditure
  to: rwa_kspi
  edge_type: causal
  notes: 'Critic-added: Higher real consumption expenditure drives consumer credit
    demand and loan origination at Kaspi.kz, expanding the loan portfolio and thus
    risk-weighted assets.'
  identification_strategy:
    type: panel_regression
    argument: Real household expenditure drives consumer credit origination which
      expands risk-weighted assets. Regional variation in consumption growth (driven
      by local labor market conditions) provides cross-sectional identification, controlling
      for bank-level lending standards.
    key_assumption: Regional consumption shocks affect RWA only through the credit
      demand channel, not through simultaneous changes in bank risk appetite or portfolio
      rebalancing.
  unit_specification:
    treatment_unit: log
    outcome_unit: log
  acceptance_criteria:
    plausibility:
      expected_sign: positive
  timing:
    lag: 1
    lag_unit: quarter
  forbidden_controls:
  - ppop_kspi
  - cor_kspi
assumptions:
- id: scope_consistency
  description: Transmission of global shocks to Kazakhstan-specific outcomes preserves
    relative comparisons across regions within KZ.
  applies_to_edges:
