- id: cpi_headline_quarterly
  name: Headline CPI (quarterly, log)
  unit: log
  description: Quarterly-frequency log CPI (constructed by averaging monthly logs
    within quarter or using end-of-quarter), used to deflate quarterly nominal expenditure
    consistently.
  type: continuous
  observed: true
  frequency: Q
  derived: true
  identity:
    formula: quarterly_avg(cpi_headline)
    depends_on:
    - cpi_headline
  tags:
  - critic_generated
- id: fdi_inflows
  name: FDI inflows
  unit: pct_gdp
  description: Net foreign direct investment inflows (e.g., % of GDP). Can affect
    exchange rate pressures, domestic demand, and thereby inflation and the policy
    reaction function.
  type: continuous
  observed: true
  frequency: M
  tags:
  - critic_generated
  exogenous: true
- id: real_income_level
  name: Real disposable income level
  unit: log
  description: Level of real disposable income (or a close proxy). Drives nominal
    consumption expenditure via permanent-income / Keynesian consumption channels.
    Distinct from 'real_income' which is currently modeled as a growth rate.
  type: continuous
  observed: true
  frequency: M
  tags:
  - critic_generated
  exogenous: true
- id: trade_openness_structure
  name: Trade openness / sectoral import dependence (structural)
  unit: index
  description: Slow-moving structural determinants of import dependence (e.g., sector
    composition, trade policy regime). Treated as predetermined over the sample window
    and used to justify variation in pre-period import share exposure.
  type: continuous
  observed: true
  frequency: M
  tags:
  - critic_generated
- id: fx_change_monthly
  name: Monthly FX depreciation (Δlog KZT/USD)
  unit: log_point
  description: Monthly change in log KZT/USD (e.g., Δ log(avg KZT/USD) or log(end-of-month)
    − log(prev end-of-month)), used to construct imported inflation exposure at monthly
    frequency.
  type: continuous
  observed: true
  frequency: M
  derived: true
  identity:
    formula: diff(kzt_usd_monthly)
    depends_on:
    - kzt_usd_monthly
  tags:
  - critic_generated
- id: real_expenditure_quarterly
  name: Real consumption expenditure (quarterly, log)
  unit: log
  description: Quarterly real consumption expenditure in logs, defined as nominal
    consumption (log) deflated by quarterly CPI (log). Frequency-consistent counterpart
    to avoid mixing monthly CPI with quarterly nominal expenditure.
  type: continuous
  observed: true
  frequency: Q
  derived: true
  identity:
    formula: nominal_expenditure - cpi_headline_quarterly
    depends_on:
    - nominal_expenditure
    - cpi_headline_quarterly
  tags:
  - critic_generated
