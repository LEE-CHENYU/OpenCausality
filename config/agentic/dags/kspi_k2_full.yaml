    source: manual
    added_at: '2026-02-02'
- id: cpi_tradable
  name: Tradable CPI
  description: CPI for tradable goods (import-weighted). Block A validated.
  unit: log
  frequency: monthly
  type: index
  observed: true
  latent: false
  scope: kazakhstan_only
  release_lag:
    periods: 1
    lag_unit: month
  source:
    preferred:
    - connector: bns
      dataset: prices
      series: cpi_tradable
  transforms:
  - log
  aggregation:
    method: end_of_period
    seasonal_adjust: true
  role_constraints:
    never_control: false
  validated_evidence:
    block_id: block_a_fx_passthrough
    description: 11.3% FX pass-through to tradable CPI
    immutable: true
  tags:
  - prices
  - inflation
  - block_a
  provenance:
    source: manual
    added_at: '2026-02-02'
- id: cpi_nontradable
  name: Non-tradable CPI
  description: CPI for non-tradable goods (services). Block A falsification.
  unit: log
  frequency: monthly
  type: index
  observed: true
  latent: false
  scope: kazakhstan_only
  release_lag:
    periods: 1
    lag_unit: month
