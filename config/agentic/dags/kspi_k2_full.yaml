- id: k2_ratio_kspi
  name: KSPI K2 capital ratio
  description: Kaspi.kz K2 capital adequacy ratio (Total Capital / RWA).
  unit: pct
  frequency: quarterly
  type: share
  observed: true
  latent: false
  scope: kazakhstan_only
  derived: true
  identity:
    name: k2_identity
    formula: exp(total_capital_kspi - rwa_kspi)
    depends_on:
    - total_capital_kspi
    - rwa_kspi
  release_lag:
    periods: 2
    lag_unit: month
  source:
    preferred:
    - connector: kspi_quarterly
      dataset: capital
      series: k2_ratio
      notes: May require 20-F for NBK figures
  role_constraints:
    never_control: false
  tags:
  - capital
  - kspi
