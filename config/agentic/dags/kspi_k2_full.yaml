    seasonal_adjust: false
  role_constraints:
    never_control: false
    never_instrument: true
  tags:
  - monetary_policy
  - transmission
  provenance:
    source: manual
    added_at: '2026-02-02'
- id: cpi_headline
  name: Headline CPI
