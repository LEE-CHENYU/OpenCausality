    outcome_unit: log
  notes: Payments segment revenue feeds into pre-provision operating profit.
  provenance:
    source: manual
    added_at: '2026-02-18'
- id: kzt_usd_to_kzt_usd_monthly
  from: kzt_usd
  to: kzt_usd_monthly
  edge_type: identity
  notes: 'Critic-added: Time aggregation/resampling (e.g., monthly average or end-of-period)
    of daily exchange rate to monthly series.'
  unit_specification:
    treatment_unit: log_level (daily ln KZT/USD)
    outcome_unit: log_level (monthly ln KZT/USD, e.g., monthly average of daily logs)
  acceptance_criteria:
    plausibility:
      expected_sign: positive
  timing:
    lag: 0
  forbidden_controls: []
- id: cpi_headline_to_cpi_headline_quarterly
  from: cpi_headline
  to: cpi_headline_quarterly
  edge_type: identity
  notes: 'Critic-added: Time aggregation from monthly CPI to quarterly CPI (e.g.,
    average of monthly log CPI within quarter).'
  unit_specification:
    treatment_unit: log_level (monthly ln CPI index)
    outcome_unit: log_level (quarterly ln CPI index, e.g., quarterly average of monthly
      logs)
  acceptance_criteria:
    plausibility:
      expected_sign: positive
  timing:
    lag: 0
  forbidden_controls: []
- id: brent_price_to_kzt_usd
  from: brent_price
  to: kzt_usd
  edge_type: causal
  notes: 'Critic-added: Terms-of-trade and export revenue channel: higher Brent improves
    FX inflows and appreciates the domestic currency (lower USD/KZT), affecting the
    exchange rate.'
  identification_strategy:
    type: IV (external shocks / shift-share in oil price innovations)
    argument: Use oil_supply_shock (and optionally oil_demand_shock decomposed to
      isolate non-domestic components) as instruments for brent_price to isolate exogenous
      oil price movements; include vix_shock/global activity controls to soak up common
      global factors that co-move with both Brent and KZT/USD.
    key_assumption: Oil supply shocks affect KZT/USD only through Brent (and related
      terms-of-trade), not via other direct channels once global risk (VIX) and global
      activity are conditioned on.
  unit_specification:
    treatment_unit: log_level (ln Brent price, USD/barrel)
    outcome_unit: log_level (ln KZT/USD)
  acceptance_criteria:
    plausibility:
      expected_sign: negative
  timing:
    lag: 0
  forbidden_controls: []
- id: kzt_usd_monthly_to_imported_inflation_instrument
  from: kzt_usd_monthly
  to: imported_inflation_instrument
  edge_type: identity
  notes: 'Critic-added: Imported inflation IV is constructed as interaction of pre-period
    import share with monthly exchange rate depreciation.'
  acceptance_criteria:
    plausibility:
      expected_sign: positive
  timing:
    lag: 0
  forbidden_controls: []
  unit_specification:
    treatment_unit: log_point (monthly average log KZT/USD)
    outcome_unit: pct (percentage points of imported inflation instrument)
- id: cpi_headline_quarterly_to_real_expenditure
  from: cpi_headline_quarterly
  to: real_expenditure
  edge_type: identity
  notes: 'Critic-added: Real expenditure is nominal expenditure deflated by the quarterly
    CPI (log-difference deflation).'
  acceptance_criteria:
    plausibility:
      expected_sign: negative
  timing:
    lag: 0
  forbidden_controls: []
  unit_specification:
    treatment_unit: log_point (quarterly log CPI index)
    outcome_unit: log_point (quarterly log real expenditure)
- id: fdi_inflows_to_kzt_usd
  from: fdi_inflows
  to: kzt_usd
  edge_type: causal
  notes: 'Critic-added: Balance-of-payments channel: higher FDI inflows increase FX
    supply and tend to appreciate the domestic currency (lower USD/KZT), affecting
    the exchange rate.'
  identification_strategy:
    type: shift_share_iv
    argument: Instrument Kazakhstan's FDI inflows using (i) a pre-period sectoral
      composition of FDI exposure (or sectoral weights in the economy) interacted
      with (ii) global sector-level FDI supply shocks (e.g., OECD/UNCTAD outward FDI
      by sector, global financial conditions for source countries). This isolates
      plausibly exogenous variation in FDI driven by foreign supply rather than Kazakhstan-specific
      FX conditions.
    key_assumption: Conditional on included controls for global shocks (oil supply/demand,
      VIX) and domestic macro policy reactions, global sector-level FDI supply shocks
      affect KZT/USD only through their impact on FDI inflows (exclusion restriction).
  acceptance_criteria:
    plausibility:
      expected_sign: negative
  timing:
    lag: 1
  forbidden_controls: []
  unit_specification:
    treatment_unit: pct_gdp (percentage points of GDP)
    outcome_unit: log_point (log KZT per USD)
- id: real_income_level_to_nominal_expenditure
  from: real_income_level
  to: nominal_expenditure
  edge_type: causal
  notes: 'Critic-added: Higher real disposable income increases nominal consumption
    expenditure (via higher consumption demand); in logs this is an elasticity-type
    relationship.'
  unit_specification:
    treatment_unit: log_point (log real disposable income level)
    outcome_unit: log_point (log nominal consumption expenditure)
  acceptance_criteria:
    plausibility:
      expected_sign: positive
  timing:
    lag: 1
  forbidden_controls:
  - real_expenditure
  - nominal_expenditure
  - cpi_headline
  - cpi_headline_quarterly
  - kzt_usd
  identification_strategy:
    type: instrumental_variables
    argument: Instrument real_income_level using predetermined components such as
      transfer_income (policy-driven) and/or external commodity/oil shocks interacting
      with exposure (if available), and estimate the causal effect on nominal consumption
      expenditure.
    key_assumption: The instrument shifts household disposable income without directly
      affecting consumption preferences except through income (exclusion), and is
      not driven by contemporaneous consumption shocks.
- id: imported_inflation_instrument_to_cpi_tradable
  from: imported_inflation_instrument
  to: cpi_tradable
  edge_type: causal
  notes: 'Critic-added: Bartik-style imported inflation shock: higher exchange-rate
    depreciation interacted with pre-period import exposure raises prices of tradable/imported
    goods.'
  identification_strategy:
    type: IV (shift-share / Bartik) with 2SLS
    argument: Use imported_inflation_instrument (E_import_share × kzt_usd_monthly)
      as an exogenous cost-push shifter for tradables, exploiting cross-sectional
      or sectoral variation in pre-determined import shares; estimate pass-through
      to cpi_tradable using 2SLS with the instrumented import-price component.
    key_assumption: Conditional on fixed effects and common shocks, pre-period import
      shares are predetermined and affect cpi_tradable only through exposure to exchange-rate-driven
      import cost changes (exclusion restriction).
  unit_specification:
    treatment_unit: pp (percentage points of imported inflation exposure; E_import_share
      in ratio × monthly log-point FX change scaled to pp if desired)
    outcome_unit: log_point (monthly or quarterly change in log tradable CPI, consistent
      with node definition)
  acceptance_criteria:
    plausibility:
      expected_sign: positive
  timing:
    lag: 1
  forbidden_controls:
  - kzt_usd
  - kzt_usd_monthly
  - cpi_tradable
  - cpi_headline
  - cpi_headline_quarterly
- id: trade_openness_structure_to_e_import_share
  from: trade_openness_structure
  to: E_import_share
  edge_type: causal
  notes: 'Critic-added: Long-run trade structure (openness/sectoral composition) determines
    the pre-period import share used as exposure in the Bartik instrument.'
  identification_strategy:
    type: Design-based (predetermined / pre-period measurement) + controls via fixed
      effects
    argument: Construct E_import_share from a pre-treatment/base period using trade_openness_structure
      measured before the shock period; estimate the mapping using only pre-period
      data (or treat as calibration), optionally with sector fixed effects if panelized.
    key_assumption: No reverse causality from later outcomes/shocks to pre-period
      import shares; measurement is locked in before the analysis window.
  unit_specification:
    treatment_unit: index (dimensionless trade openness / import-dependence index)
    outcome_unit: share (ratio from 0 to 1)
  acceptance_criteria:
    plausibility:
      expected_sign: positive
  timing:
    lag: 0
  forbidden_controls:
  - E_import_share
- id: kzt_usd_to_trade_openness_structure
  from: kzt_usd
  to: trade_openness_structure
  edge_type: causal
  notes: 'Critic-added: Sustained depreciation/appreciation changes relative prices
    and can shift the effective import dependence/trade openness index over time via
    substitution, sourcing, and sectoral composition.'
  identification_strategy:
    type: instrumental_variables
    argument: Instrument kzt_usd with oil_supply_shock, oil_demand_shock, and vix_shock
      (and/or brent_price shocks) as external drivers of KZT/USD. Estimate the effect
      on trade_openness_structure using 2SLS, controlling for global conditions.
    key_assumption: 'Exclusion: oil/VIX shocks affect Kazakhstan’s trade openness/sectoral
      import dependence only through their impact on the exchange rate over the horizon
      studied (no direct channel once global activity/commodity-cycle controls are
      included).'
  acceptance_criteria:
    plausibility:
      expected_sign: any
  timing:
    lag: 4
  forbidden_controls:
  - kzt_usd_monthly
  - imported_inflation_instrument
  - cpi_tradable
  - cpi_headline
  - nbk_policy_rate
  unit_specification:
    treatment_unit: log_point (log KZT per USD, e.g., monthly avg)
    outcome_unit: index (trade openness / sectoral import dependence index level)
- id: kzt_usd_monthly_to_fx_change_monthly
  from: kzt_usd_monthly
  to: fx_change_monthly
  edge_type: identity
  notes: 'Critic-added: Time-series transformation: first-difference of logs (monthly
    depreciation).'
  unit_specification:
    treatment_unit: log_point (log KZT/USD, monthly level)
    outcome_unit: log_point (monthly Δlog KZT/USD)
  acceptance_criteria:
    plausibility:
      expected_sign: positive
  timing:
    lag: 1
  forbidden_controls: []
- id: nominal_expenditure_to_real_expenditure_quarterly
  from: nominal_expenditure
  to: real_expenditure_quarterly
  edge_type: identity
  notes: 'Critic-added: Deflation identity component: nominal consumption is an input
    into quarterly real consumption.'
  unit_specification:
    treatment_unit: log (nominal expenditure level, quarterly)
    outcome_unit: log (real expenditure level, quarterly)
  acceptance_criteria:
    plausibility:
      expected_sign: positive
  timing:
    lag: 0
  forbidden_controls:
  - real_expenditure_quarterly
- id: cpi_headline_quarterly_to_real_expenditure_quarterly
  from: cpi_headline_quarterly
  to: real_expenditure_quarterly
  edge_type: identity
  notes: 'Critic-added: Deflation identity component: quarterly CPI is used to convert
    nominal to real expenditure in log terms.'
  unit_specification:
    treatment_unit: log (headline CPI level, quarterly)
    outcome_unit: log (real expenditure level, quarterly)
  acceptance_criteria:
    plausibility:
      expected_sign: negative
  timing:
    lag: 0
  forbidden_controls:
  - real_expenditure_quarterly
- id: real_expenditure_quarterly_to_real_expenditure
  from: real_expenditure_quarterly
  to: real_expenditure
  edge_type: identity
  notes: 'Critic-added: Temporal disaggregation/assignment: map quarterly real expenditure
    to the real_expenditure series used downstream (e.g., repeat within quarter or
    interpolate).'
  unit_specification:
    treatment_unit: log (real expenditure level, quarterly)
    outcome_unit: log (real expenditure level, monthly or interpolated to model frequency)
  acceptance_criteria:
    plausibility:
      expected_sign: positive
  timing:
    lag: 0
  forbidden_controls:
  - real_expenditure
- id: fx_change_monthly_to_imported_inflation_instrument
  from: fx_change_monthly
  to: imported_inflation_instrument
  edge_type: identity
  notes: 'Critic-added: Definitional/identity dependency: imported inflation instrument
    equals import share times monthly FX depreciation.'
  unit_specification:
    treatment_unit: log_point (monthly Δlog KZT/USD)
    outcome_unit: pp (percentage points contribution to imported inflation instrument)
  acceptance_criteria:
    plausibility:
      expected_sign: positive
  timing:
    lag: 0
  forbidden_controls: []
assumptions:
- id: oil_shock_exogeneity
  statement: Baumeister oil shocks are exogenous to Kazakhstan macro conditions.
  applies_to_edges:
  - oil_supply_to_brent
  - oil_supply_to_fx
  - oil_demand_to_fx
  testable: false
- id: vix_exogeneity
  statement: VIX innovations are exogenous to Kazakhstan-specific factors.
  applies_to_edges:
  - vix_to_fx
  testable: false
- id: imported_inflation_exclusion
  statement: Imported inflation IV affects income only through price changes.
  applies_to_edges:
  - cpi_to_nominal_income
  testable: true
  test_method: Placebo test on non-tradable-intensive sectors.
- id: block_a_validity
  statement: Block A FX pass-through estimates are unconfounded by omitted variables.
  applies_to_edges:
  - fx_to_cpi_tradable
  - fx_to_cpi_nontradable
  testable: true
  test_method: Pre-trends and falsification on non-tradables.
- id: scope_consistency
  statement: BNS household data and KSPI Kazakhstan operations share population.
  applies_to_edges:
  - shock_to_npl_kspi
  - shock_to_cor_kspi
  testable: false
latents:
- id: ifrs9_overlay
  description: Forward-looking macro overlay in IFRS 9 ECL provisioning.
  affects:
  - cor_kspi
- id: regulatory_changes
  description: NBK RW rule changes affecting unsecured consumer loans.
  affects:
  - rwa_kspi
- id: kspi_customer_composition
  description: Unobserved changes in KSPI customer risk profile.
  affects:
  - npl_kspi
  - cor_kspi
- id: migration
  description: Labor migration affecting regional income dynamics.
  affects:
  - nominal_income
  - real_income
- id: fiscal_policy
  description: Unobserved fiscal policy responses to shocks.
  affects:
  - transfer_income
  - nominal_income
allowed_refinements:
- id: add_control
  allowed_controls:
  - lag_cpi
  - lag_oil_price
  - lag_nbk_rate
- id: change_lag_length
  range:
  - 1
  - 8
- id: regime_split
  allowed_dates:
  - 2015-08
  - 2020-03
  - 2022-02
