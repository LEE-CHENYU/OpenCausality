- id: kzt_usd_monthly
  name: KZT/USD exchange rate (monthly, log)
  unit: log
  description: Monthly-frequency (e.g., end-of-month or monthly average) log exchange
    rate used for macro identities and instruments to align frequency with CPI/income/expenditure.
  type: continuous
  observed: true
  frequency: M
  derived: true
  identity:
    formula: monthly_avg(kzt_usd)
    depends_on:
    - kzt_usd
  tags:
