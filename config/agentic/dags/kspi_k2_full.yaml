      dataset: prices
      series: cpi_nontradable
  transforms:
  - log
  aggregation:
    method: end_of_period
    seasonal_adjust: true
  role_constraints:
    never_control: false
  validated_evidence:
    block_id: block_a_fx_passthrough_falsification
    description: Near-zero FX pass-through to non-tradable CPI
    immutable: true
  tags:
  - prices
  - inflation
  - block_a
  - falsification
  provenance:
    source: manual
    added_at: '2026-02-02'
- id: imported_inflation_instrument
  name: Imported inflation IV
  description: Constructed instrument for imported inflation (FX change × pre-period
    import share).
  unit: pct
  frequency: monthly
  type: continuous
  observed: true
  latent: false
  scope: kazakhstan_only
  derived: true
  identity:
    name: imported_inflation_iv
    formula: 100 * E_import_share * fx_change_monthly
    depends_on:
    - fx_change_monthly
    - E_import_share
  release_lag:
    periods: 1
    lag_unit: month
  role_constraints:
    never_control: true
  tags:
  - instrument
  - inflation
  provenance:
    source: manual
    added_at: '2026-02-02'
- id: E_import_share
  name: Pre-period import share
  description: Pre-period regional import intensity (static exposure).
  unit: share
  frequency: static
  type: exposure
  observed: true
  latent: false
  scope: kazakhstan_only
  source:
    preferred:
    - connector: bns
      dataset: regional_accounts
      series: import_share
  role_constraints:
    never_control: false
  tags:
  - exposure
  - import
  provenance:
    source: manual
    added_at: '2026-02-02'
  exogenous: true
- id: nominal_income
  name: Nominal monetary income
