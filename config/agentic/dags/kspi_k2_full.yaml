schema_version: 2
metadata:
  name: kspi_k2_stress
  description: Global shocks -> KZ macro -> KSPI balance sheet -> K2 capital ratio
  target_node: k2_ratio_kspi
  created: '2026-02-02'
  owner: research_team
  scope_default: kazakhstan_only
  tags:
  - kspi
  - capital
  - stress_test
  - k2
nodes:
- id: oil_supply_shock
  name: Oil supply shock
  description: Baumeister oil supply shock (exogenous to Kazakhstan).
  unit: sd
  frequency: monthly
  type: continuous
  observed: true
  latent: false
  scope: global
  release_lag:
    periods: 1
    lag_unit: month
  source:
    preferred:
    - connector: baumeister
      dataset: oil_shocks
      series: oil_supply_shock
  transforms:
  - aggregate_mean_to_quarter
  aggregation:
    method: average
    seasonal_adjust: false
  role_constraints:
    never_control: true
  tags:
  - oil
  - shock
  - exogenous
  provenance:
    source: manual
    added_at: '2026-02-02'
  exogenous: true
- id: oil_demand_shock
  name: Oil demand shock
  description: Baumeister oil demand shock (global demand-driven).
  unit: sd
  frequency: monthly
  type: continuous
  observed: true
  latent: false
  scope: global
  release_lag:
    periods: 1
    lag_unit: month
  source:
    preferred:
    - connector: baumeister
      dataset: oil_shocks
      series: oil_demand_shock
  transforms:
  - aggregate_mean_to_quarter
  aggregation:
    method: average
    seasonal_adjust: false
  role_constraints:
    never_control: true
  tags:
  - oil
  - shock
  - exogenous
  provenance:
    source: manual
    added_at: '2026-02-02'
  exogenous: true
- id: global_activity_shock
  name: Global activity innovation
  description: Innovation in global activity index (IGREA).
  unit: innovation
  frequency: monthly
  type: continuous
  observed: true
  latent: false
  scope: global
  release_lag:
    periods: 1
    lag_unit: month
  source:
    preferred:
    - connector: fred
      dataset: global_activity
      series: IGREA
  transforms:
  - innovation
  - aggregate_mean_to_quarter
  aggregation:
    method: average
    seasonal_adjust: false
  role_constraints:
    never_control: true
  tags:
  - global
  - shock
  - exogenous
  provenance:
    source: data_scout
    added_at: '2026-02-09'
    connector: fred
    dataset: global_activity
- id: vix_shock
  name: VIX shock
  description: Innovation in VIX (risk aversion shock).
  unit: innovation
  frequency: daily
  type: continuous
  observed: true
  latent: false
  scope: global
  release_lag:
    periods: 0
    lag_unit: day
  source:
    preferred:
    - connector: fred
      dataset: financial
      series: VIXCLS
  transforms:
  - innovation
  - aggregate_mean_to_month
  aggregation:
    method: average
    seasonal_adjust: false
  role_constraints:
    never_control: true
  tags:
  - financial
  - shock
  - exogenous
  provenance:
    source: data_scout
    added_at: '2026-02-09'
    connector: fred
    dataset: financial
  exogenous: true
- id: kzt_usd
  name: KZT/USD exchange rate
  description: Kazakh tenge per US dollar, log level.
  unit: log
  frequency: daily
  type: continuous
  observed: true
  latent: false
  scope: kazakhstan_only
  release_lag:
    periods: 0
    lag_unit: day
  source:
    preferred:
    - connector: nbk
      dataset: exchange_rates
      series: kzt_usd
    fallback:
    - connector: fred
      dataset: exchange_rates
      series: DEXKZUS
  transforms:
  - log
  aggregation:
    method: end_of_period
    seasonal_adjust: false
  role_constraints:
    never_control: false
  tags:
  - fx
  - transmission
  provenance:
    source: manual
    added_at: '2026-02-02'
- id: brent_price
  name: Brent crude oil price
  description: Brent spot price, USD per barrel, log level.
  unit: log
  frequency: daily
  type: continuous
  observed: true
  latent: false
  scope: global
  release_lag:
    periods: 0
    lag_unit: day
  source:
    preferred:
    - connector: fred
      dataset: commodities
      series: DCOILBRENTEU
  transforms:
  - log
  aggregation:
    method: average
    seasonal_adjust: false
  role_constraints:
    never_control: false
  tags:
  - oil
  - commodity
  provenance:
    source: manual
    added_at: '2026-02-02'
- id: nbk_policy_rate
